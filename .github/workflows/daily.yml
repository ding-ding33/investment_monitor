name: Daily Portfolio Tracker

on:
  schedule:
    # UTC 周日-周四 22:17 = 北京时间周一-周五 06:17（仅工作日）
    # 避开整点高峰，降低定时任务延迟/丢弃概率
    - cron: "17 22 * * 0-4"
  workflow_dispatch:  # 允许手动触发

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # 直接使用仓库里已有的邮件 secrets；DEEPSEEK_API_KEY 这次不需要。
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python main.py

      - name: Commit and push history file
        run: |
          git config user.name "portfolio-bot"
          git config user.email "bot@portfolio.local"
          git add data/portfolio_history.xlsx
          git diff --cached --quiet || (
            git commit -m "📊 $(date +'%Y-%m-%d') 日度净值更新" &&
            git push
          )
